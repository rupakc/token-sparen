name: Docs deploy

# Reusable: builds the site and the wiki from one release tag and publishes both. Called only
# by release.yml (job `docs`, after `finalize`: a successful, approved release) and by docs.yml
# (a manual re-deploy of an already published release, verified first). Never triggered by
# itself, so the public docs never describe a version that was not released (review C1).
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      TOKEN_SPAREN_DENYLIST:
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Exact release tag only
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a release tag"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # no pip cache: a cache written by another workflow must not reach the job that holds the
      # deny-list secret and builds the published site (review m-R3)
      - run: pip install --no-cache-dir -e ".[docs]"
      - run: python scripts/build_site.py --out _site
      # Fail closed: a missing secret must not pass as "clean". Scans the generated tree.
      - run: python scripts/check_denylist.py --path _site --require-private-words
        env:
          TOKEN_SPAREN_DENYLIST: ${{ secrets.TOKEN_SPAREN_DENYLIST }}
      - run: python scripts/build_wiki.py --out _wiki --ref "$TAG"
      - run: python scripts/check_denylist.py --path _wiki --require-private-words
        env:
          TOKEN_SPAREN_DENYLIST: ${{ secrets.TOKEN_SPAREN_DENYLIST }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wiki
          path: _wiki
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # Syncs the generated pages into the repository's wiki. OWNER ACTION O3: create the first wiki
  # page once in the GitHub UI (Wiki tab) so the .wiki repository exists; until then the checkout
  # below fails. Only this workflow writes the wiki; manual wiki edits are overwritten.
  wiki:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: wiki
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wiki
          path: _wiki
      - id: co
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ github.token }}
      - if: steps.co.outcome == 'failure'
        run: |
          echo "::error::wiki checkout failed. OWNER ACTION O3: create the first wiki page in the GitHub UI, then re-run."
          exit 1
      - env:
          TAG: ${{ inputs.tag }}
        run: |
          cd wiki
          find . -maxdepth 1 -name '*.md' -type f -delete
          cp ../_wiki/*.md .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already up to date"; exit 0
          fi
          git commit -m "docs: sync wiki from $TAG"
          git push
