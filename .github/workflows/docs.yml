name: Docs

# Manual re-deploy only. The public site and wiki are published by release.yml (job `docs`,
# after `finalize`), so they never describe a version that was not released (review C1). This
# workflow re-publishes the docs of an already released version exactly as its tag holds them
# (e.g. to restore the previous release's docs after a failed deploy): run it "from" the tag
# (Actions -> Docs -> Run workflow -> Use workflow from: Tags -> vX.Y.Z) with the same `tag`
# input. The tag must be an exact vX.Y.Z on main with a published (not draft, not pre-release)
# GitHub Release, and it passes the same owner-signed verification as a release (verify-tag.yml).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released version to re-deploy, exactly vX.Y.Z (run the workflow from that tag)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: docs-redeploy
  cancel-in-progress: false

jobs:
  released:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Exact release tag, dispatched from that tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a release tag vX.Y.Z"; exit 1; }
          [ "$GITHUB_REF" = "refs/tags/$TAG" ] || { echo "::error::run this workflow from the tag $TAG (Use workflow from), not $GITHUB_REF"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$TAG^{commit}" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - name: A published GitHub Release exists for the tag
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --json tagName,isDraft,isPrerelease \
                    --jq '"\(.tagName) \(.isDraft) \(.isPrerelease)"') \
            || { echo "::error::no published GitHub Release for $TAG"; exit 1; }
          [ "$state" = "$TAG false false" ] || { echo "::error::$TAG is not a published release ($state)"; exit 1; }

  verify:
    needs: released
    permissions:
      contents: read
    uses: ./.github/workflows/verify-tag.yml
    with:
      tag: ${{ inputs.tag }}
      expect-sha: ""

  deploy:
    needs: [released, verify]
    permissions:
      contents: write  # the wiki push
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-deploy.yml
    with:
      tag: ${{ inputs.tag }}
    secrets:
      TOKEN_SPAREN_DENYLIST: ${{ secrets.TOKEN_SPAREN_DENYLIST }}
