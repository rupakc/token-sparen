name: Docs

# The public site describes the last release: it is built and deployed only from a release tag.
# workflow_dispatch republishes the latest release tag (for docs fixes cherry-picked to a
# release); it never builds main. Between releases the site keeps describing the last release.
# Nothing is built or deployed (site or wiki) unless the tag passes the same owner-signed,
# exact-tag-on-main verification as release.yml (`verify`, the shared verify-tag.yml; review M2).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            tag="$PUSHED"
          else
            tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          fi
          # exact release tags only: prereleases such as v1.0.0-rc1 are refused
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "not an exact release tag: $tag"; exit 1
          fi
          # and the tagged commit must be on main
          if ! git merge-base --is-ancestor "refs/tags/$tag" origin/main; then
            echo "$tag is not on main"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  verify:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/verify-tag.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      expect-sha: ${{ github.event_name == 'push' && github.sha || '' }}

  build:
    needs: [tag, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # no pip cache: a cache written by another workflow must not reach the job that holds the
      # deny-list secret and builds the published site (review m-R3)
      - run: pip install --no-cache-dir -e ".[docs]"
      - run: python scripts/build_site.py --out _site
      # Fail closed: a missing secret must not pass as "clean". Scans the generated tree.
      - run: python scripts/check_denylist.py --path _site --require-private-words
        env:
          TOKEN_SPAREN_DENYLIST: ${{ secrets.TOKEN_SPAREN_DENYLIST }}
      - run: python scripts/build_wiki.py --out _wiki --ref "$TAG"
        env:
          TAG: ${{ needs.tag.outputs.tag }}
      - run: python scripts/check_denylist.py --path _wiki --require-private-words
        env:
          TOKEN_SPAREN_DENYLIST: ${{ secrets.TOKEN_SPAREN_DENYLIST }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wiki
          path: _wiki
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: _site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

  # Syncs the generated pages into the repository's wiki. OWNER ACTION O3: create the first wiki
  # page once in the GitHub UI (Wiki tab) so the .wiki repository exists; until then the checkout
  # below fails. Only this workflow writes the wiki; manual wiki edits are overwritten.
  wiki:
    needs: [tag, verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wiki
          path: _wiki
      - id: co
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ github.token }}
      - if: steps.co.outcome == 'failure'
        run: |
          echo "::error::wiki checkout failed. OWNER ACTION O3: create the first wiki page in the GitHub UI, then re-run."
          exit 1
      - env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          cd wiki
          find . -maxdepth 1 -name '*.md' -type f -delete
          cp ../_wiki/*.md .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already up to date"; exit 0
          fi
          git commit -m "docs: sync wiki from $TAG"
          git push
