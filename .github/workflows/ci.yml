name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly: supply-chain audit against new advisories
  workflow_call:
    secrets:
      TOKEN_SPAREN_DENYLIST:
        required: false

permissions:
  contents: read

# Actions are pinned to full commit SHAs (Dependabot proposes updates); every checkout drops the
# token from .git/config. The only secret is TOKEN_SPAREN_DENYLIST, passed explicitly.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict token_sparen
      - run: mypy --strict bench

  # E4 harness end to end with no Docker, no `claude`, no grader, no quota and no credential:
  # fake backend, fake grader, synthetic tasks, scripted quota in the workspace's own account
  # directory, a temporary bare repository as the anchors remote (never this repository).
  bench-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: dry run (screening, power, confirmation, gate, report)
        env:
          TOKEN_SPAREN_BENCH_STATE: ${{ runner.temp }}/bench-account
        run: |
          out="$RUNNER_TEMP/bench"
          python -m bench run --dry-run --campaign ci --out "$out"
          for stage in screening confirmation; do
            python -m bench grade --stage "$stage" --out "$out"
            python -m bench analyse --stage "$stage" --out "$out"
          done
          python -m bench power --out "$out"
          python -m bench gate --out "$out"
          python -m bench report --stage screening --out "$out"
          python -m bench report --stage confirmation --out "$out"
          python -m bench status --out "$out"
          test ! -e "$RUNNER_TEMP/bench-account"  # the real quota account is never touched

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest --cov=token_sparen

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -m perf --no-cov -p no:randomly
        env:
          TOKEN_SPAREN_PERF_FACTOR: "1.5"

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python scripts/check_wheel.py

  denylist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # Fail closed on main: a missing secret must not pass as "clean". Forks and pull requests
      # have no access to the secret and check the built-in patterns only.
      - run: >-
          python scripts/check_denylist.py
          ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '--require-private-words' || '' }}
        env:
          TOKEN_SPAREN_DENYLIST: ${{ secrets.TOKEN_SPAREN_DENYLIST }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,docs]"
      # Build only (into a temporary directory); deployment is docs.yml, from release tags.
      - run: python scripts/build_site.py --out "$RUNNER_TEMP/_site"
      - run: pytest --no-cov tests/test_build_site.py
        env:
          TOKEN_SPAREN_REQUIRE_DOCS: "1"  # a missing Markdown install must fail

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,docs]"
      - run: pytest --no-cov tests/test_supply_chain.py
      # Advisory only: the runtime has no dependencies; this audits the dev and docs tooling.
      - name: pip-audit (dev and docs extras, non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --skip-editable || echo "::warning::pip-audit reported advisories in dev/docs tooling"

  e2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python evals/e2/run.py --strict

  plugin-validate:
    runs-on: ubuntu-latest
    continue-on-error: true  # optional: runs only where the `claude` CLI is available
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: claude plugin validate
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "claude CLI not available; skipping plugin validation"
          fi
