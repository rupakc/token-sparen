# Every tunable lives here (hill-climbing surface). Empty sections are used from M2/M3.

[compression]
min_tokens = 2000
min_saving_ratio = 0.15
# Tools whose output is never compressed (tiny confirmations or user interaction); every tool
# in the edit category is skipped as well.
skip_tools = ["Edit", "Write", "MultiEdit", "NotebookEdit", "TodoWrite", "AskUserQuestion", "ExitPlanMode"]
persisted_max_bytes = 5000000  # larger persisted Bash outputs are not read (preview only)
save_deadline_ms = 250  # past this hook time no recovery file is written, output left as is

# Arms for the text compressor: keep head + tail lines and ceil(keep_ratio * total) overall.
[compression.levels.light]
head = 80
tail = 40
keep_ratio = 0.6

[compression.levels.standard]
head = 40
tail = 20
keep_ratio = 0.35

[compression.levels.aggressive]
head = 15
tail = 10
keep_ratio = 0.15

# Per-type knobs for the structured compressors, selected by nearest arm (keep_ratio >= 0.5
# light, >= 0.25 standard, else aggressive).
[compression.json]
max_bytes = 2000000  # larger documents go to the text compressor (latency cap)
items = { light = 10, standard = 5, aggressive = 2 }  # array items shown in full

[compression.diff]
context = { light = 3, standard = 1, aggressive = 1 }  # unchanged lines kept per side

[compression.stacktrace]
edge_frames = { light = 5, standard = 3, aggressive = 3 }  # first/last frames always kept

[compression.test_report]
block_lines = { light = 30, standard = 15, aggressive = 8 }  # lines kept per failing test block

[compression.compiler]
warnings = { light = "keep", standard = "keep", aggressive = "count" }  # keep | count

[compression.search]
per_file = { light = 20, standard = 8, aggressive = 3 }  # matches kept per file (errors always kept)

[compression.pplx]
results = { light = 10, standard = 5, aggressive = 3 }  # results shown in full; the rest as URLs

[compression.log]
tail = 30  # final lines always kept

[pricing]
# Relative list-price ratios (input = 1.0).
input = 1.0
cache_write = 1.25
cache_read = 0.1
output = 5.0

[recovery]
ttl_days = 14
max_files = 200
max_bytes = 100000000

[guards]
enabled = true  # false: no PreToolUse blocks
max_read_bytes = 5000000  # cat/Read of a larger text file without a range is blocked
# Pre-trim arm (PostToolUse): a learned candidate command's output is compressed with a
# tail-biased level (head = pretrim_head, tail = K, standard keep_ratio); never a shell rewrite.
pretrim_lines = 120  # K when a candidate names none
pretrim_head = 10

[read_dedupe]
enabled = true
min_tokens = 2000  # never below 2000 (invariant: smaller outputs are never modified)
max_entries = 200  # reads remembered per session (oldest dropped first)
max_turn_gap = 8  # pointer only if the earlier read is at most this many turns old

[governor]
# Advisory only (terminal messages, zero model tokens) unless hard_stop is set by the user.
enabled = true
session_budget_tokens = 500000000  # economy budget: billed context tokens summed over calls
econ_notice = 0.50  # share of the budget
econ_advise = 0.80
ctx_notice = 0.60  # risk: share of the context window used by the last call
ctx_advise = 0.80
hard_stop = false  # true: at >= 100 % of the budget, deny Read/Bash/WebFetch/WebSearch/Grep/Glob/LS/Task/Agent and mcp__* tools
ewma_alpha = 0.3  # per-turn burn smoothing
max_unparsed_bytes = 50000000  # first contact with a larger unparsed transcript: burn unknown
tail_scan_bytes = 1000000  # then the last call is looked up in this many trailing bytes
parse_budget_ms = 150  # per hook; a longer catch-up parse continues in the next hook

# Context window by model (fnmatch patterns on the model id). Conservative on purpose: only a
# default. The statusline-recorded window and CLAUDE_CODE_MAX_CONTEXT_TOKENS take precedence.
[governor.windows]
default = 200000

[boundary]
enabled = true
min_ctx_pct = 0.40  # advise /compact at a task boundary only when context is this full
min_overlap = 0.15  # share of the prompt's identifiers seen in recent prompts/paths; below = new task
min_turn = 3
history = 3  # recent prompts compared against
min_identifiers = 2  # a prompt with fewer identifiers is never a boundary
cooldown_turns = 10

[subagent]
enabled = true  # the brief is still a decision point (static default arm: off)

[statusline]
segments = ["ctx", "burn", "rate", "saved", "trims", "learn"]
ascii = false  # true: ASCII glyphs (ts, |, x, r) instead of the symbols
color = true  # NO_COLOR in the environment also turns colours off
parse_budget_ms = 20  # transcript catch-up per render (the governor's cache keeps the rest)

[learn]
gamma = 0.98  # Beta posterior discount per observation (forgets toward the prior)
posterior_cap = 50  # max a + b of a posterior; whole-vector mean-preserving rescale, so the long-run
# prior weight is cap-independent (do not "fix" this to scale only the excess over the prior)
decision_log_max_bytes = 20000000  # projects/<key>/decisions.jsonl rotates past this size

[facts]
# Repo-fact learning: planned (M3), no keys yet.

[prune]
# Tool pruning (opt-in): planned (M3), no keys yet.

[loopguard]
# Failure-loop guard: planned (M3), no keys yet.

[adapter]
latency_budget_ms = 400  # hard cap per hook; on overrun the hook returns the host no-op
latency_sample_rate = 0.1  # share of hooks whose duration goes to logs/latency.jsonl
latency_log_max_bytes = 1000000  # latency.jsonl rotates past this size

[extensions]
# Let a trusted extension replace a built-in compressor for a content type it also handles.
# Honoured only from ~/.token-sparen/config.toml or TOKEN_SPAREN_EXTENSIONS__ALLOW_OVERRIDE,
# never from a project's token-sparen.toml.
allow_override = false
