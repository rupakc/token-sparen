# Every tunable lives here (hill-climbing surface). Empty sections are used from M2/M3.

[compression]
min_tokens = 2000
min_saving_ratio = 0.15
# Tools whose output is never compressed (tiny confirmations or user interaction); every tool
# in the edit category is skipped as well.
skip_tools = ["Edit", "Write", "MultiEdit", "NotebookEdit", "TodoWrite", "AskUserQuestion", "ExitPlanMode"]
persisted_max_bytes = 5000000  # larger persisted Bash outputs are not read (preview only)
save_deadline_ms = 250  # past this hook time no recovery file is written, output left as is
# Quality first: only these content types are ever offered to the compression decision point.
# text, table and stacktrace are not (too little evidence that trimming them is harmless); widen
# in your own config. A project file may only remove entries.
allow_ctypes = ["diff", "search", "test_report", "compiler", "build_log", "json", "pplx", "log"]
# File contents (the Read tool, and shell commands that print a file: cat, head, tail, sed -n,
# git show <rev>:<path>, ...) are never trimmed: the agent usually uses them. true opts in (your
# own config only; a project file may only set false).
trim_file_contents = false

# Arms for the text compressor: keep head + tail lines and ceil(keep_ratio * total) overall.
[compression.levels.light]
head = 80
tail = 40
keep_ratio = 0.6

[compression.levels.standard]
head = 40
tail = 20
keep_ratio = 0.35

[compression.levels.aggressive]
head = 15
tail = 10
keep_ratio = 0.15

# Per-type knobs for the structured compressors, selected by nearest arm (keep_ratio >= 0.5
# light, >= 0.25 standard, else aggressive).
[compression.json]
max_bytes = 2000000  # larger documents go to the text compressor (latency cap)
items = { light = 10, standard = 5, aggressive = 2 }  # array items shown in full

[compression.diff]
context = { light = 3, standard = 1, aggressive = 1 }  # unchanged lines kept per side

[compression.stacktrace]
edge_frames = { light = 5, standard = 3, aggressive = 3 }  # first/last frames always kept

[compression.test_report]
block_lines = { light = 30, standard = 15, aggressive = 8 }  # lines kept per failing test block

[compression.compiler]
warnings = { light = "keep", standard = "keep", aggressive = "count" }  # keep | count

[compression.search]
per_file = { light = 20, standard = 8, aggressive = 3 }  # matches kept per file (errors always kept)

[compression.pplx]
results = { light = 10, standard = 5, aggressive = 3 }  # results shown in full; the rest as URLs

[compression.log]
tail = 30  # final lines always kept

[pricing]
# Relative list-price ratios (input = 1.0).
input = 1.0
cache_write = 1.25
cache_read = 0.1
output = 5.0

[recovery]
ttl_days = 14
max_files = 200
max_bytes = 100000000

[guards]
enabled = true  # false: no PreToolUse blocks
max_read_bytes = 5000000  # cat/Read of a larger text file without a range is blocked
# Pre-trim arm (PostToolUse): a learned candidate command's output is compressed with a
# tail-biased level (head = pretrim_head, tail = K, standard keep_ratio); never a shell rewrite.
pretrim_lines = 120  # K when a candidate names none
pretrim_head = 10
# Keep ratio of the bounded pre-trim arm (M4 tuning knob). No default: unset, it is the larger of
# the packaged and the configured compression.levels.standard.keep_ratio (a raised standard arm
# raises it, a lowered one never lowers it); any number in [0, 1] is used as is. A project may
# only raise it (keep more), compared with that larger ratio while unset.
# pretrim_bounded_keep_ratio = 0.35

[read_dedupe]
enabled = true
min_tokens = 2000  # never below 2000 (invariant: smaller outputs are never modified)
max_entries = 200  # reads remembered per session (oldest dropped first)
max_turn_gap = 8  # pointer only if the earlier read is at most this many turns old

[governor]
# Advisory only (terminal messages, zero model tokens) unless hard_stop is set by the user.
enabled = true
session_budget_tokens = 500000000  # economy budget: billed context tokens summed over calls
econ_notice = 0.50  # share of the budget
econ_advise = 0.80
ctx_notice = 0.60  # risk: share of the context window used by the last call
ctx_advise = 0.80
hard_stop = false  # true: at >= 100 % of the budget, deny Read/Bash/WebFetch/WebSearch/Grep/Glob/LS/Task/Agent and mcp__* tools
ewma_alpha = 0.3  # per-turn burn smoothing
max_unparsed_bytes = 50000000  # first contact with a larger unparsed transcript: burn unknown
tail_scan_bytes = 1000000  # then the last call is looked up in this many trailing bytes
parse_budget_ms = 150  # per hook; a longer catch-up parse continues in the next hook

# Context window by model (fnmatch patterns on the model id). Conservative on purpose: only a
# default. The statusline-recorded window and CLAUDE_CODE_MAX_CONTEXT_TOKENS take precedence.
[governor.windows]
default = 200000

[boundary]
enabled = true
min_ctx_pct = 0.40  # advise /compact at a task boundary only when context is this full
min_overlap = 0.15  # share of the prompt's identifiers seen in recent prompts/paths; below = new task
min_turn = 3
history = 3  # recent prompts compared against
min_identifiers = 2  # a prompt with fewer identifiers is never a boundary
cooldown_turns = 10

[subagent]
enabled = true  # the brief is still a decision point (static default arm: off)

[statusline]
segments = ["ctx", "burn", "rate", "saved", "trims", "learn", "pruned"]
ascii = false  # true: ASCII glyphs (ts, |, x, r) instead of the symbols
color = true  # NO_COLOR in the environment also turns colours off
parse_budget_ms = 20  # transcript catch-up per render (the governor's cache keeps the rest)

[learn]
gamma = 0.98  # Beta posterior discount per observation (forgets toward the prior)
posterior_cap = 50  # max a + b of a posterior; whole-vector mean-preserving rescale, so the long-run
# prior weight is cap-independent (do not "fix" this to scale only the excess over the prior)
decision_log_max_bytes = 20000000  # projects/<key>/decisions.jsonl rotates past this size
min_parent_obs = 5  # a parent posterior lends its mean to a child prior only with >= this many real obs
kappa_default = 6  # prior strength when too few sibling buckets to estimate it
kappa_min = 2  # method-of-moments kappa is clamped to [kappa_min, kappa_max]
kappa_max = 20
kappa_min_siblings = 3  # sibling buckets (each >= min_parent_obs) needed to estimate kappa
kappa_regret = 20  # fixed strength of every regret prior (designed default and parent derived)
enabled = true  # false -> the static policy (no learning, propensity 1)
ladder_obs = 20  # a trimming arm unlocks the next more aggressive one only with >= this many
# regret observations (pooled full bucket, or any back-off level in project/global scope) and a
# regret posterior mean <= tau
pending_max = 500  # decisions awaiting reward kept in the session overlay (oldest evicted)
regret_window_turns = 6  # a trim is watched for regret this many turns, then credited regret 0
global_weight = 0.3  # a folded session's evidence enters global/posteriors.json times this (the delta)
global_age_days = 90  # global entries untouched this long are halved at the next fold
breaker_window = 50  # circuit breaker: rolling regret rate over the last N settled trims of a point
breaker_min_obs = 20  # ... evaluated only once at least this many are in the window
breaker_every = 25  # ... re-evaluated only after this many new observations since the last
breaker_lcb_q = 0.0005  # ... trips iff rate > 2 x tau AND this lower quantile of
# Beta(1 + k, 1 + n - k) > tau. Trips in 1000 trims (medium tier): 0.0005 -> ~2-3 % at tau,
# ~39 % at 8 %, ~97 % at 12 %, 100 % at 3 x tau; 0.05 -> ~65 % at tau
breaker_sessions = 3  # a tripped point uses its safe arm for this many folded sessions, then
breaker_reentry_scale = 0.25  # re-enters with its trimming-arm project evidence scaled by this
pretrim_min_decisions = 5  # a command becomes a pre-trim candidate after >= N trimming compressions
pretrim_max_ratio = 0.4  # ... with mean tokens_after / tokens_before <= this and no regret ever
pretrim_lines = 120  # tail lines kept for a new candidate
pretrim_max = 200  # candidates kept per project (least recently seen dropped)
# M4 options, all off by default (current behaviour) until an evidence-based tuning run selects
# them; user-only (never from a project's token-sparen.toml).
savings_reward = "scaled"  # savings reward at decision time: "scaled" = min(1, removed x resends /
# p95 of the bucket); "fraction" = removed / output tokens; "counterfactual" = removed / max removed
# over the point's trimming arms on the same output x min(1, resends / resend_horizon) (compresses
# the output once per arm: CI gates its hook p95 at <= 1.6x the default reward's, same process;
# enabling it in a tuning campaign requires the absolute < 50 ms check on the target machine:
# TOKEN_SPAREN_PERF_STRICT=1 pytest -m perf tests/perf/test_counterfactual_reward.py --no-cov); "cost" =
# cache-weighted cost removed (pricing.cache_write + pricing.cache_read x resends) / its p95
resend_horizon = 20  # R of the counterfactual reward: resends at which a removal counts in full
ladder_retry_decisions = 0  # 0 = off. N > 0: after N decisions of a bucket within one session
# (counted per session, not per project) with the next harsher arm locked only because the safer
# arm is not yet established (too few observations, regret mean <= tau), that arm competes for
# one decision (probe), then the count restarts

# Regret target per tier: a trimming arm is feasible only if its sampled regret is <= tau
# (high tier additionally needs its regret 95 % upper bound <= tau).
[learn.tau]
low = 0.10
medium = 0.05
high = 0.01
none = 1.0

# High-tier decision points learn only when the user opts in per point: `<point> = true` here in
# ~/.token-sparen/config.toml (never a project file, a session override or a TOKEN_SPAREN_* var).
# Without it the safe arm is always used. High tier is opt-in by design.
[learn.optin]

# Decision points held at their safe arm: the engine decides them (bucket, breaker, propensity 1)
# but never explores a trimming arm. The subagent brief stays off until the live benchmark shows
# non-inferior quality (spec 6.7); it also has no reward signal yet. `compression = true` rules
# out every output trim (the static fallback and the learned pre-trim included); listed here so
# `token-sparen config set learn.hold.<point> true` works for one session.
[learn.hold]
subagent_brief = true
compression = false
pretrim = false
read_dedupe = false
loopguard = false

# Propensity floor per tier: probability of choosing the safe arm outright.
[learn.floor]
low = 0.05
medium = 0.05
high = 0.02
none = 0.0

# Bucket back-off per decision point: most specific feature set first, [] = the "*" bucket.
[learn.backoff.compression]
levels = [["band", "cat", "size", "ctype", "phase"], ["cat", "ctype"], ["ctype"], []]

[learn.backoff.pretrim]
levels = [["ctype", "size"], ["ctype"], []]

[learn.backoff.read_dedupe]
levels = [["cat", "size"], ["size"], []]

[learn.backoff.subagent_brief]
levels = [["phase"], []]

[learn.backoff.loopguard]
levels = [["cat"], []]

# Designed default prior means (the last link of the prior chain), with strength kappa_default.
# Hand-set, to be refit in M4 from E1 replay data. A safe arm's mean 0 is stored as Beta(1e-3, kappa).
[learn.defaults.compression.off]
savings = 0.0
regret = 0.0

[learn.defaults.compression.light]
savings = 0.35
regret = 0.02

[learn.defaults.compression.standard]
savings = 0.6
regret = 0.04

[learn.defaults.compression.aggressive]
savings = 0.8
regret = 0.08

[learn.defaults.pretrim.off]
savings = 0.0
regret = 0.0

[learn.defaults.pretrim.bounded]
savings = 0.5
regret = 0.05

[learn.defaults.read_dedupe.off]
savings = 0.0
regret = 0.0

[learn.defaults.read_dedupe.pointer]
savings = 0.9
regret = 0.03

[learn.defaults.subagent_brief.off]
savings = 0.0
regret = 0.0

[learn.defaults.subagent_brief.on]
savings = 0.3
regret = 0.05

# Loop guard (review M1, wave C1 fix round 1): savings = the loop broke (the error did not recur
# within the next 5 tool calls) after a delivered redirect at >= 3 occurrences; a decision that
# never redirected is not observed. The engine gates the intervening arms on the natural break
# rate (observed without a redirect; prior mean 0.8, strength 10): an arm competes only when
# lcb_0.9 of its savings > ucb_0.9 of that rate, else it is only explored by the floor. Neutral,
# weak savings priors (0.1, strength 2); regret prior = the medium tier's tau. Regret = the
# user's next prompt starts with (or, at most 8 words, contains) stop / wait / undo / revert /
# that's wrong / no, don't, or the user interrupted.
[learn.defaults.loopguard.patient]
savings = 0.0
regret = 0.0

[learn.defaults.loopguard.standard]
savings = 0.1
savings_strength = 2
regret = 0.05

[learn.defaults.loopguard.eager]
savings = 0.1
savings_strength = 2
regret = 0.05

[facts]
# Learned repository facts (micro-skills), injected at SessionStart as a labelled data block.
# A project file may only switch them off or lower max_facts / max_tokens.
enabled = true
withhold_floor = 0.1   # per active fact and session: withheld with this probability (baseline)
activate_lcb = 0.55    # candidate -> active when the effect posterior's lcb(0.1) clears this
retire_ucb = 0.4       # active -> retired when the effect posterior's ucb(0.9) falls below
max_tokens = 300       # injected block budget (estimated tokens)
max_facts = 8

[prune]
# Learned tool pruning (opt-in, spec 6.10): never-used MCP servers are denied in the checkout's
# .claude/settings.local.json. Enable per project with `token-sparen prune enable`, or for every
# project with `enabled = true` in ~/.token-sparen/config.toml. `enabled` and `builtins` are read
# from that file only (never from TOKEN_SPAREN_* variables, a session or a project file); a
# project's token-sparen.toml may only switch pruning off with `allow = false`.
enabled = false
builtins = false      # also prune always-loaded built-in tools an SDK init record listed
allow = true          # false: never prune here, and revert our rules at the next fold
min_sessions = 3      # sessions with the tool available and unused before it is a candidate
min_prompts = 15      # ... spanning at least this many prompts
idle_minutes = 60     # apply only when the project was idle this long (prompt cache)
tau = 0.01            # high tier: regret ucb must be <= tau
ucb_q = 0.95
lease_sessions = 15   # a prune is a lease: restored after this many sessions to observe use again

[loopguard]
# Failure-loop guard (spec 6.11): within one turn and per agent, the same error k times (k
# learned: patient 5, standard 3, eager 2) or the same edit made and undone repeatedly gets one
# short redirect (additionalContext); a second detection only tells the user. `[learn.hold]
# loopguard = true` keeps the most patient arm (k = 5), it does not switch the guard off;
# `enabled = false` does. A project file may only switch it off or raise min_k.
enabled = true
min_k = 2          # floor on the arm's k (a project may only raise it)
watch_calls = 5    # tool calls after the redirect that decide "loop broken" (savings 1)

[output_style]
# Output-style directive (spec 6.6, high tier): one short line at SessionStart (startup, clear,
# compact; never resume) asking for concise prose, never shorter code. Off by default in v1.0;
# enabled only from the user's config.toml or a session override. A project file may only switch
# it off; the directive is user-only.
enabled = false
directive = "concise"   # a name from mechanisms/outputstyle.DIRECTIVES; unknown -> off

[adapter]
latency_budget_ms = 400  # hard cap per hook; on overrun the hook returns the host no-op
latency_sample_rate = 0.1  # share of hooks whose duration goes to logs/latency.jsonl
latency_log_max_bytes = 1000000  # latency.jsonl rotates past this size

[extensions]
# Let a trusted extension replace a built-in compressor for a content type it also handles.
# Honoured only from ~/.token-sparen/config.toml, never from a session override, a
# project's token-sparen.toml or a TOKEN_SPAREN_* variable.
allow_override = false

[ope]
# E3 (`token-sparen ope`) quality constraint: a verdict needs enough evidence, else it is
# "insufficient" (constraint_ok = null). User-only (never from a project's token-sparen.toml).
max_unsupported_trim = 0.2  # share of the target's trimming mass the log cannot support
min_outcome_coverage = 0.8  # share of logged trimming decisions with a settled outcome
min_trims = 60  # logged trimming decisions needed before any verdict (an exact bound also applies)
