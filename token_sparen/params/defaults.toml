# Every tunable lives here (hill-climbing surface). Sections are filled by later tasks.

[compression]
min_tokens = 2000
min_saving_ratio = 0.15

# Arms for the text compressor: keep head + tail lines and ceil(keep_ratio * total) overall.
[compression.levels.light]
head = 80
tail = 40
keep_ratio = 0.6

[compression.levels.standard]
head = 40
tail = 20
keep_ratio = 0.35

[compression.levels.aggressive]
head = 15
tail = 10
keep_ratio = 0.15

[pricing]
# Relative list-price ratios (input = 1.0).
input = 1.0
cache_write = 1.25
cache_read = 0.1
output = 5.0

[recovery]
ttl_days = 14
max_files = 200
max_bytes = 100000000

