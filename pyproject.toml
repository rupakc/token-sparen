[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-sparen"
version = "0.1.0.dev0"
description = "Learned, recoverable token optimisation for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Rupak Chakraborty" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "build"]

[project.scripts]
token-sparen = "token_sparen.cli:main"

[tool.setuptools]
packages = [
  "token_sparen",
  "token_sparen.store",
  "token_sparen.compress",
  "token_sparen.mechanisms",
  "token_sparen.learn",
  "token_sparen.adapters",
  "token_sparen.adapters.claude",
  "token_sparen.testing",
]

[tool.setuptools.package-data]
token_sparen = ["params/*.toml", "assets/statusline.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = '-m "not perf"'
markers = [
    "perf: strict wall-clock budgets; run with `pytest -m perf --no-cov` (CI job perf)",
    "real_seed: no suite-wide engine seed (tests of hookpolicy.test_seed itself)",
]

[tool.coverage.run]
source = ["token_sparen"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "UP", "B", "PLW1514"]

[tool.ruff.lint.per-file-ignores]
"evals/e2/make_corpus.py" = ["E501", "F841", "B007"]

[tool.mypy]
python_version = "3.11"
strict = true
