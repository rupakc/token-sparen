[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-sparen"
version = "0.1.0.dev0"
description = "Learned, recoverable token optimisation for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Rupak Chakraborty" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy"]

[project.scripts]
token-sparen = "token_sparen.cli:main"

[tool.setuptools]
packages = ["token_sparen", "token_sparen.store", "token_sparen.compress"]

[tool.setuptools.package-data]
token_sparen = ["params/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not perf"'
markers = ["perf: strict wall-clock budgets; run with `pytest -m perf --no-cov` (CI job perf)"]

[tool.coverage.run]
source = ["token_sparen"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
